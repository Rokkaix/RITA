name: RITA site ve canlı uçuş güncellemesi

on:
  push:
    branches: ["claude/bn-depo-usage-issue-3ucip6"]
  schedule:
    - cron: "7,22,37,52 * * * *"   # her 15 dakikada bir (uçuş durumu, kapı, gecikme)
  workflow_dispatch:
    inputs:
      rg_gunler:
        description: 'Resmî Gazete için denenecek günler (YYYYMMDD, boşlukla)'
        required: false
        default: ''
      rg_yaz:
        description: 'Günleri gerçekten işle (evet) ya da yalnız dene (boş)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rita
  cancel-in-progress: false

jobs:
  tarama:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uçuşları topla (İstanbul'dan tüm THY kalkışları)
        run: python tools/canli_ucuslar.py
      - name: TBMM milletvekili listesi (3 saatte bir)
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) % 3 )) -eq 0 ] && [ $(( 10#$(date -u +%M) )) -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/canli_tbmm.py
          fi
      - name: Resmî Gazete atama kararları (2 saatte bir; teyitliler otomatik işlenir)
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) % 2 )) -eq 1 ] && [ $(( 10#$(date -u +%M) )) -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install --quiet pypdf
            sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tur poppler-utils >/dev/null
            RG_GUNLER="${{ github.event.inputs.rg_gunler }}" RG_KURU="${{ github.event.inputs.rg_yaz != 'evet' && github.event.inputs.rg_gunler || '' }}" python tools/resmi_gazete.py
          fi
      - name: Doğrulanmış portre fotoğrafları (günde bir; TBMM + görevi doğrulanan Vikipedi)
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) )) -eq 2 ] && [ $(( 10#$(date -u +%M) )) -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            timeout 40m python tools/fotolar.py --tbmm --viki 600
          fi
      - name: Kaydet
        run: |
          if ! git diff --quiet data/; then
            git config user.name "RITA canlı güncelleme"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ucuslar.json data/tbmm.json data/rita-veri.json data/fotolar.json
            git commit -m "Canlı veri $(TZ=Europe/Istanbul date '+%F %H:%M')"
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              # yönetici aynı anda onay verdiyse: en güncel hâli alıp kayıtları yeniden ekle
              git rebase --abort
              cp data/ucuslar.json /tmp/u.json; [ -f data/tbmm.json ] && cp data/tbmm.json /tmp/t.json; [ -f data/fotolar.json ] && cp data/fotolar.json /tmp/f.json
              git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"
              cp /tmp/u.json data/ucuslar.json; [ -f /tmp/t.json ] && cp /tmp/t.json data/tbmm.json; [ -f /tmp/f.json ] && cp /tmp/f.json data/fotolar.json
              RG_GUNLER="${{ github.event.inputs.rg_gunler }}" RG_KURU="${{ github.event.inputs.rg_yaz != 'evet' && github.event.inputs.rg_gunler || '' }}" python tools/resmi_gazete.py || true
              git add data/ucuslar.json data/tbmm.json data/rita-veri.json data/fotolar.json
              git commit -m "Canlı veri $(TZ=Europe/Istanbul date '+%F %H:%M')" || true
            fi
            git push
          fi

  yayin:
    needs: tarama
    if: always() && needs.tarama.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Siteyi kur
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
