name: RITA site ve canlı uçuş güncellemesi

on:
  push:
    branches: ["claude/bn-depo-usage-issue-3ucip6"]
  schedule:
    - cron: "7,22,37,52 * * * *"   # her 15 dakikada bir (uçuş durumu, kapı, gecikme)
  workflow_dispatch:
    inputs:
      rg_gunler:
        description: 'Resmî Gazete için denenecek günler (YYYYMMDD, boşlukla)'
        required: false
        default: ''
      rg_yaz:
        description: 'Günleri gerçekten işle (evet) ya da yalnız dene (boş)'
        required: false
        default: ''
      kesif:
        description: 'Yalnız sayfa yapısı keşfi: boşlukla ayrılmış adresler (veri değişmez)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rita-${{ github.event.inputs.kesif != '' && 'kesif' || 'ana' }}
  cancel-in-progress: false

jobs:
  kesif:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.kesif != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sayfa yapısını göster
        run: python tools/kesif.py ${{ github.event.inputs.kesif }}

  tarama:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || github.event.inputs.kesif == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uçuşları topla (İstanbul'dan tüm THY kalkışları)
        run: python tools/canli_ucuslar.py
      - name: TBMM milletvekili listesi (3 saatte bir)
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) % 3 )) -eq 0 ] && [ $(( 10#$(date -u +%M) )) -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/canli_tbmm.py
          fi
      - name: Resmî Gazete atama kararları (2 saatte bir; teyitliler otomatik işlenir)
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) % 2 )) -eq 1 ] && [ $(( 10#$(date -u +%M) )) -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install --quiet pypdf
            sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tur poppler-utils >/dev/null
            RG_GUNLER="${{ github.event.inputs.rg_gunler }}" RG_KURU="${{ github.event.inputs.rg_yaz != 'evet' && github.event.inputs.rg_gunler || '' }}" python tools/resmi_gazete.py
          fi
      - name: Doğrulanmış portre fotoğrafları (günde bir; TBMM + görevi doğrulanan Vikipedi)
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) )) -eq 2 ] && [ $(( 10#$(date -u +%M) )) -lt 15 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            timeout 50m python tools/fotolar.py --tbmm --vali --kaymakam 300 --viki 3000
          fi
      - name: Kaydet
        run: |
          if ! git diff --quiet data/; then
            git config user.name "RITA canlı güncelleme"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # yalnız BU çalışmanın değiştirdiği dosyalar yazılır (eski kopya başkasının yenisini ezmesin)
            DEG=$(git diff --name-only -- data/ucuslar.json data/tbmm.json data/fotolar.json)
            mkdir -p /tmp/yedek; for f in $DEG; do cp "$f" /tmp/yedek/; done
            git add data/ucuslar.json data/tbmm.json data/rita-veri.json data/fotolar.json
            git commit -m "Canlı veri $(TZ=Europe/Istanbul date '+%F %H:%M')"
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              # aynı anda başka bir kayıt geldiyse: en güncel hâli al, yalnız bu çalışmanın değişikliklerini yeniden uygula
              git rebase --abort
              git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"
              for f in $DEG; do
                if [ "$f" = "data/fotolar.json" ]; then python tools/fotolar_birlestir.py data/fotolar.json /tmp/yedek/fotolar.json; else cp "/tmp/yedek/$(basename $f)" "$f"; fi
              done
              RG_GUNLER="${{ github.event.inputs.rg_gunler }}" RG_KURU="${{ github.event.inputs.rg_yaz != 'evet' && github.event.inputs.rg_gunler || '' }}" python tools/resmi_gazete.py || true
              git add data/ucuslar.json data/tbmm.json data/rita-veri.json data/fotolar.json
              git commit -m "Canlı veri $(TZ=Europe/Istanbul date '+%F %H:%M')" || true
            fi
            git push
          fi

  yayin:
    needs: tarama
    if: always() && needs.tarama.result != 'failure' && (github.event_name != 'workflow_dispatch' || github.event.inputs.kesif == '')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Siteyi kur
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
