name: RITA site ve canlı uçuş güncellemesi

on:
  push:
    branches: ["claude/bn-depo-usage-issue-3ucip6"]
  schedule:
    - cron: "7,37 * * * *"   # her 30 dakikada bir
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rita
  cancel-in-progress: false

jobs:
  tarama:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uçuşları topla (İstanbul'dan tüm THY kalkışları)
        run: python tools/canli_ucuslar.py
      - name: TBMM milletvekili listesi (3 saatte bir)
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) % 3 )) -eq 0 ] && [ $(( 10#$(date -u +%M) )) -lt 30 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/canli_tbmm.py
          fi
      - name: Resmî Gazete atama kararları (2 saatte bir, onaya düşer)
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) % 2 )) -eq 1 ] && [ $(( 10#$(date -u +%M) )) -lt 30 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install --quiet pypdf
            python tools/resmi_gazete.py
          fi
      - name: Kaydet
        run: |
          if ! git diff --quiet data/; then
            git config user.name "RITA canlı güncelleme"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ucuslar.json data/tbmm.json data/rita-veri.json
            git commit -m "Canlı veri $(TZ=Europe/Istanbul date '+%F %H:%M')"
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              # yönetici aynı anda onay verdiyse: en güncel hâli alıp kayıtları yeniden ekle
              git rebase --abort
              cp data/ucuslar.json /tmp/u.json; [ -f data/tbmm.json ] && cp data/tbmm.json /tmp/t.json
              git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"
              cp /tmp/u.json data/ucuslar.json; [ -f /tmp/t.json ] && cp /tmp/t.json data/tbmm.json
              python tools/resmi_gazete.py || true
              git add data/ucuslar.json data/tbmm.json data/rita-veri.json
              git commit -m "Canlı veri $(TZ=Europe/Istanbul date '+%F %H:%M')" || true
            fi
            git push
          fi

  yayin:
    needs: tarama
    if: always() && needs.tarama.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Siteyi kur
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
