<div id="rita-kur" hidden style="position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:#1d3461;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(13,27,51,.25);font:14px/1.45 Manrope,system-ui,sans-serif;display:flex;gap:12px;align-items:center;max-width:520px;margin:0 auto">
  <img src="icons/icon-192.png" alt="" width="40" height="40" style="border-radius:10px;background:#fff;flex:none">
  <div style="flex:1;min-width:0"><b style="display:block">RITA’yı uygulama olarak yükle</b><span id="rita-kur-t">Ana ekranınıza ekleyin; tam ekran ve çevrimdışı çalışır.</span></div>
  <button type="button" id="rita-kur-b" style="border:0;background:#fff;color:#1d3461;border-radius:10px;padding:8px 12px;font-weight:800">Yükle</button>
  <button type="button" id="rita-kur-x" aria-label="Kapat" style="border:0;background:none;color:#fff;font-size:20px;padding:4px 6px">×</button>
</div>
<script>
(function(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
  var box=document.getElementById('rita-kur'),t=document.getElementById('rita-kur-t'),b=document.getElementById('rita-kur-b'),x=document.getElementById('rita-kur-x'),ev=null;
  var inApp=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var off=function(){try{return localStorage.getItem('rita-kur-x')==='1'}catch(e){return false}};
  if(inApp||off())return;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;box.hidden=false});
  if(ios){t.textContent='Safari’de Paylaş düğmesine, sonra “Ana Ekrana Ekle”ye dokunun.';b.hidden=true;box.hidden=false}
  b.onclick=function(){if(ev){ev.prompt();ev.userChoice.then(function(){box.hidden=true})}};
  x.onclick=function(){box.hidden=true;try{localStorage.setItem('rita-kur-x','1')}catch(e){}};
})();
</script>
